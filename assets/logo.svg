<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="adf-grad" x1="16" y1="16" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="adf-node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>
  <!-- Outer hexagonal frame with 10% margin (16..112) -->
  <polygon points="64,16 106,40 106,88 64,112 22,88 22,40" stroke="url(#adf-grad)" stroke-width="4" stroke-linejoin="round" fill="#0F172A" fill-opacity="0.85"/>
  <!-- Connecting orchestration edges -->
  <line x1="64" y1="64" x2="64" y2="30" stroke="url(#adf-grad)" stroke-width="3" stroke-linecap="round"/>
  <line x1="64" y1="64" x2="94" y2="47" stroke="url(#adf-grad)" stroke-width="3" stroke-linecap="round"/>
  <line x1="64" y1="64" x2="94" y2="81" stroke="url(#adf-grad)" stroke-width="3" stroke-linecap="round"/>
  <line x1="64" y1="64" x2="64" y2="98" stroke="url(#adf-grad)" stroke-width="3" stroke-linecap="round"/>
  <line x1="64" y1="64" x2="34" y2="81" stroke="url(#adf-grad)" stroke-width="3" stroke-linecap="round"/>
  <line x1="64" y1="64" x2="34" y2="47" stroke="url(#adf-grad)" stroke-width="3" stroke-linecap="round"/>
  <!-- Outer ring links -->
  <polygon points="64,30 94,47 94,81 64,98 34,81 34,47" stroke="#94A3B8" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
  <!-- 6 Subagent Nodes -->
  <circle cx="64" cy="30" r="6.5" fill="url(#adf-node)" stroke="#F8FAFC" stroke-width="2"/>
  <circle cx="94" cy="47" r="6.5" fill="url(#adf-node)" stroke="#F8FAFC" stroke-width="2"/>
  <circle cx="94" cy="81" r="6.5" fill="url(#adf-node)" stroke="#F8FAFC" stroke-width="2"/>
  <circle cx="64" cy="98" r="6.5" fill="url(#adf-node)" stroke="#F8FAFC" stroke-width="2"/>
  <circle cx="34" cy="81" r="6.5" fill="url(#adf-node)" stroke="#F8FAFC" stroke-width="2"/>
  <circle cx="34" cy="47" r="6.5" fill="url(#adf-node)" stroke="#F8FAFC" stroke-width="2"/>
  <!-- Central Orchestrator Hub -->
  <circle cx="64" cy="64" r="11" fill="#F8FAFC" stroke="url(#adf-grad)" stroke-width="3.5"/>
  <circle cx="64" cy="64" r="4.5" fill="#6366F1"/>
</svg>
